name: Build docker images

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  # every monday, so the images get the latest (security) updates of the debian base image
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# never push the same images from two runs at the same time
concurrency:
  group: docker-images
  cancel-in-progress: false

env:
  # debian-base only for amd64, arm64 and riscv64 (the other images already only build these + windows amd64)
  RELEASE_ALL_ARCH: amd64 arm64 riscv64
  # the upstream repos need different go versions, let go download the one from go.mod
  GOTOOLCHAIN: auto
  DOCKER_REGISTRY_NAME: ${{ vars.DOCKER_REGISTRY_NAME || secrets.DOCKERHUB_USERNAME }}

jobs:
  # debian-base is the base image of iscsi, smb and nfs, so it has to be pushed first
  debian-base:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push debian-base
        run: make docker_release

  images:
    needs: debian-base
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target:
          - docker_csi_node_driver_registrar
          - docker_csi_driver_iscsi
          - docker_livenessprobe
          - docker_csi_driver_smb
          - docker_csi_provisioner
          - docker_csi_resizer
          - docker_csi_driver_nfs
          - docker_external_snapshotter
    name: ${{ matrix.target }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v7

      # the go binaries are cross compiled on the runner and copied into the images.
      # Use the go version of the upstream go.mod files (vendored code does not build with newer go),
      # GOTOOLCHAIN=auto downloads a newer one when upstream needs it.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }}
        run: make binfmt ${{ matrix.target }}
