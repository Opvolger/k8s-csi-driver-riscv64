apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: k0s-cluster
  user: admin
spec:
  hosts:
  # https://serverfault.com/questions/160581/how-to-setup-passwordless-sudo-on-linux
{% for host in groups["k0s"] %}
  - ssh:
      address: {{ hostvars[host].ansible_host }}
      user: opvolger
    role: {{ hostvars[host].k8s.role }}
    k0sBinaryPath: {{ hostvars[host].k8s.k0sBinaryPath }}
    noTaints: true
{% if hostvars[host].k8s.environment is defined %}
    environment:
{% for key, value in hostvars[host].k8s.environment.items() %}
      {{ key }}: {{ value }}
{% endfor %}
{% endif %}
{% endfor %}
  k0s:
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: Cluster
      metadata:
        name: k0s
      spec:
        images:
          calico:
            cni:
              image: quay.io/k0sproject/calico-cni
              version: v3.29.7-1
            node:
              image: quay.io/k0sproject/calico-node
              version: v3.29.7-1
            kubecontrollers:
              image: quay.io/k0sproject/calico-kube-controllers
              version: v3.29.7-1
        api:
          externalAddress: 192.168.8.1
          k0sApiPort: 9443
          port: 6443
        installConfig:
          users:
            etcdUser: etcd
            kineUser: kube-apiserver
            konnectivityUser: konnectivity-server
            kubeAPIserverUser: kube-apiserver
            kubeSchedulerUser: kube-scheduler
        extensions:
          helm:
            repositories:
            - name: traefik
              url: https://traefik.github.io/charts
            charts:
            - name: traefik
              chartname: traefik/traefik
              version: 39.0.7
              namespace: traefik-system
              values: |
                ports:
                  web:
                    http:
                      redirections:
                        entryPoint:
                          to: websecure
                          scheme: https
                          permanent: true
                ingressRoute:
                  dashboard:
                    enabled: true
                    matchRule: Host(`dashboard.k8s.opvolger.eu`)
                    entryPoints:
                      - web
                providers:
                  kubernetesGateway:
                    enabled: true
                gateway:
                  listeners:
                    web:
                      namespacePolicy:
                        from: All
            concurrencyLevel: 5
        konnectivity:
          adminPort: 8133
          agentPort: 8132
        network:
          calico:
            mode: vxlan
          kubeProxy:
            disabled: false
            mode: nftables
          kuberouter:
            autoMTU: true
            mtu: 0
            peerRouterASNs: ""
            peerRouterIPs: ""
          podCIDR: 10.244.0.0/16
          provider: kuberouter
          serviceCIDR: 10.96.0.0/12
        podSecurityPolicy:
          defaultPolicy: 00-k0s-privileged
        storage:
          type: etcd
        telemetry:
          enabled: true
  options:
    wait:
      enabled: false # raspberry pi 3 is slow! timeout
    drain:
      enabled: true
      gracePeriod: 2m0s
      timeout: 5m0s
      force: true
      ignoreDaemonSets: true
      deleteEmptyDirData: true
      podSelector: ""
      skipWaitForDeleteTimeout: 0s
    concurrency:
      limit: 30
      workerDisruptionPercent: 10
      uploads: 5
    evictTaint:
      enabled: false
      taint: k0sctl.k0sproject.io/evict=true
      effect: NoExecute
      controllerWorkers: false
