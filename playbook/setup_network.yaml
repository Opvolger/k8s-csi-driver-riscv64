- name: Setup for all or servers the correct ip
  become: true
  hosts: k0s
  tasks:
    - name: Template a file to /etc/netplan/01-network-manager-all.yaml
      ansible.builtin.template:
        src: 01-network-manager-all.yaml
        dest: /etc/netplan/01-network-manager-all.yaml
        owner: root
        group: root
        mode: '0600'
      notify:
        - Apply netplan

  handlers:
    - name: Apply netplan
      ansible.builtin.shell: |
        netplan apply
      args:
        executable: /bin/bash
      ignore_errors: true
